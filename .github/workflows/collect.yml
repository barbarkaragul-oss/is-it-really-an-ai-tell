name: collect
# Rebuilds the corpora from their public sources and re-measures every marker. The corpus text is
# never committed: out/ and cache/ stay on the runner, and what lands in the repository is data/ (ids
# and numbers, plus sentences from the MIT-licensed RAID model arms and from the essays written for
# this project) and the site in docs/.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'   # Mondays, off the top of the hour: the measurement
    - cron: '37 6 * * 4'   # Thursdays: only touches the cached corpora, so they are not evicted

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  measure:
    if: github.event.schedule != '37 6 * * 4'
    runs-on: ubuntu-latest
    # the essays add about a minute, and the 85 MB PERSUADE download on a week the cache is missing
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx collector/fetch.ts --want 4000
      - run: npx tsx collector/fetch-raid.ts --want 1500 --models gpt4,chatgpt,llama-chat,mistral-chat
      # Reddit posts come from RAID's 802 MB CSV of unattacked rows, as two byte windows (58 MB). The
      # rows kept from them are cached. The key is the pinned file version and window offsets
      # (collector/raid-windows.json) and the code that decides which rows are kept, so it needs no
      # request to RAID's host; the collector itself sends one HEAD request and fails if the host now
      # serves another file, and uses the cached rows if the host does not answer. The cache holds the
      # people's Reddit posts in full: it is never printed and never reaches the repository.
      - name: Restore the RAID rows
        id: raid-rows
        uses: actions/cache/restore@v6
        with:
          path: cache/raid
          key: raid-rows-${{ hashFiles('collector/raid-windows.json', 'collector/raid-csv.ts', 'collector/fetch-raid.ts') }}
      - run: npx tsx collector/fetch-raid.ts --genre posts
      # saved straight away, so a later failing step does not cost next week the download
      - name: Save the RAID rows
        if: steps.raid-rows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cache/raid
          key: ${{ steps.raid-rows.outputs.cache-primary-key }}
      # School essays: the students' side is PERSUADE 2.0, read from a mirror of three CSVs (85 MB,
      # https://huggingface.co/datasets/nlpatunt/D_persuade_2) into cache/persuade/. The files are pinned
      # by size and SHA-256 in scripts/collect-essays.ts, which refuses any other bytes, cached or not, so
      # the cache is keyed on that script: a new pin downloads again. The cache holds the students'
      # essays in full: it is never printed and never reaches the repository.
      - name: Restore the PERSUADE mirror
        id: persuade
        uses: actions/cache/restore@v6
        with:
          path: cache/persuade
          key: persuade-${{ hashFiles('scripts/collect-essays.ts') }}
      # --check first: it fails the job when the committed frame no longer describes the corpus. The plain
      # run after it rewrites the frame from whatever it read, so after it the check could never fail.
      - run: npx tsx scripts/collect-essays.ts --check
      - name: Save the PERSUADE mirror
        if: steps.persuade.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cache/persuade
          key: ${{ steps.persuade.outputs.cache-primary-key }}
      # the students' arm goes to out/, which is not committed. The machine arms are not generated here:
      # contamination.ts writes them out of their committed records in data/generated/.
      - run: npx tsx scripts/collect-essays.ts
      # every kind of writing is named, so a corpus that failed to arrive fails the job instead of being
      # skipped; measure-all rewrites data/summary.json from the kinds it ran, so all of them run here
      - run: npx tsx scripts/contamination.ts --genres abstracts,posts,essays
      - run: npx tsx scripts/measure-all.ts --genres abstracts,posts,essays
      - run: npx tsx scripts/evidence.ts --genres abstracts,posts,essays
      - run: npx tsx scripts/claude-matched.ts
      - run: npm test
      # --release refuses abstracts measured without a complete arXiv dating (data/abstracts-dates.json)
      - run: npx tsx scripts/build.ts --release
      - name: Commit the measurement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: weekly re-measurement ($(date -u +%Y-%m-%d))"
          git pull --rebase -X theirs origin main
          git push

  # GitHub evicts a cache entry nobody has used for seven days, and the Monday job only uses it once a
  # week, so a Monday that starts a little later than the one before could find it gone and read the
  # windows or the mirror again. Restoring them midweek keeps them; this contacts nobody but GitHub.
  keep-cache:
    if: github.event.schedule == '37 6 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Touch the RAID rows
        uses: actions/cache/restore@v6
        with:
          path: cache/raid
          key: raid-rows-${{ hashFiles('collector/raid-windows.json', 'collector/raid-csv.ts', 'collector/fetch-raid.ts') }}
      - name: Touch the PERSUADE mirror
        uses: actions/cache/restore@v6
        with:
          path: cache/persuade
          key: persuade-${{ hashFiles('scripts/collect-essays.ts') }}
